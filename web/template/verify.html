<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification - {{ file_name }}</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --gradient-1: #4f46e5;
            --gradient-2: #c084fc;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(192, 132, 252, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
            margin: 0;
            color: var(--text-primary);
            overflow: hidden;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            margin-bottom: 30px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, var(--text-primary) 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin: 0;
        }

        .file-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: #e5e7eb;
            word-break: break-all;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-icon {
            font-size: 1.5rem;
            color: var(--accent-color);
            flex-shrink: 0;
        }

        .loader-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px auto;
        }

        .loader-circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.02);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1.5s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .loader-pulse {
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .status-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin: 0 0 10px 0;
            transition: color 0.3s ease;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gradient-1), var(--gradient-2));
            border-radius: 3px;
            transition: width 0.4s ease;
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.5);
        }

        .noscript-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        .footer {
            font-size: 0.75rem;
            color: rgba(156, 163, 175, 0.5);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1 class="title">Security Checking</h1>
            <p class="subtitle">Verifying browser to block automated downloads</p>
        </div>

        <div class="file-box">
            <span class="file-icon">📦</span>
            <div>
                <div style="font-weight: 600; font-size: 0.95rem;">{{ file_name }}</div>
            </div>
        </div>

        <div class="loader-container">
            <div class="loader-circle"></div>
            <div class="loader-pulse"></div>
        </div>

        <p class="status-text" id="status">Connecting securely...</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <noscript>
            <div class="noscript-message">
                <strong>JavaScript Required</strong><br>
                Please enable JavaScript in your browser to pass the security verification and download this file.
            </div>
        </noscript>

        <div class="footer">
            Powered by SecureLink &bull; Session ID: {{ challenge[:8] }}
        </div>
    </div>

    <form id="verify-form" method="GET" action="">
        {% for k, v in query_params.items() %}
            <input type="hidden" name="{{ k }}" value="{{ v }}">
        {% endfor %}
        <input type="hidden" name="challenge" value="{{ challenge }}">
        <input type="hidden" name="nonce" id="nonce-input">
    </form>

    <script>
        const challenge = "{{ challenge }}";
        const difficulty = "{{ difficulty }}";
        const statusEl = document.getElementById('status');
        const progressEl = document.getElementById('progress');

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        async function startVerification() {
            try {
                // Update progress smoothly to show it's analyzing
                statusEl.textContent = "Checking browser integrity...";
                progressEl.style.width = "20%";
                await new Promise(resolve => setTimeout(resolve, 300));

                statusEl.textContent = "Solving verification puzzle...";
                progressEl.style.width = "40%";

                let nonce = 0;
                const startTime = Date.now();
                
                while (true) {
                    const hash = await sha256(challenge + nonce);
                    if (hash.startsWith(difficulty)) {
                        break;
                    }
                    nonce++;
                    
                    // Yield control to main thread periodically so the UI doesn't freeze
                    if (nonce % 800 === 0) {
                        progressEl.style.width = `${40 + Math.min(nonce / 200, 40)}%`;
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }

                progressEl.style.width = "90%";
                statusEl.textContent = "Verification successful! Redirecting...";
                statusEl.style.color = "#10b981";
                await new Promise(resolve => setTimeout(resolve, 300));
                
                progressEl.style.width = "100%";
                
                // Submit the form with solution
                document.getElementById('nonce-input').value = nonce;
                document.getElementById('verify-form').submit();
            } catch (err) {
                console.error("Verification failed:", err);
                statusEl.textContent = "Verification failed. Please reload the page.";
                statusEl.style.color = "#ef4444";
            }
        }

        // Run verification on page load
        window.addEventListener('DOMContentLoaded', startVerification);
    </script>
</body>
</html>
