name: Deploy to Heroku Container

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Build & Deploy Container to Heroku
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate with Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build and Push Docker image to Heroku
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          docker build -t registry.heroku.com/${HEROKU_APP_NAME}/web .
          docker push registry.heroku.com/${HEROKU_APP_NAME}/web

      - name: Auto-Detect Heroku Web URL & Set Dynamic FQDN
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          echo "Querying Heroku API for App Web URL and domains..."
          APP_JSON=$(curl -s -X GET "https://api.heroku.com/apps/${HEROKU_APP_NAME}" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer ${HEROKU_API_KEY}")
          
          RAW_URL=$(echo "${APP_JSON}" | jq -r '.web_url // empty')
          CLEAN_FQDN=$(echo "${RAW_URL}" | sed -e 's~https://~~' -e 's~http://~~' -e 's~/~~g')
          
          # Check domains API in case a routed domain is active
          DOMAINS_JSON=$(curl -s -X GET "https://api.heroku.com/apps/${HEROKU_APP_NAME}/domains" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer ${HEROKU_API_KEY}")
          
          DOMAIN_HOST=$(echo "${DOMAINS_JSON}" | jq -r '.[0].hostname // empty')
          if [ -n "${DOMAIN_HOST}" ] && [ "${DOMAIN_HOST}" != "null" ]; then
            CLEAN_FQDN="${DOMAIN_HOST}"
          fi
          
          if [ -z "${CLEAN_FQDN}" ] || [ "${CLEAN_FQDN}" = "null" ]; then
            CLEAN_FQDN="${HEROKU_APP_NAME}.herokuapp.com"
          fi
          
          echo "Discovered dynamic Heroku FQDN: ${CLEAN_FQDN}"
          echo "Updating Heroku config-vars with auto-detected FQDN..."
          
          curl -s -X PATCH "https://api.heroku.com/apps/${HEROKU_APP_NAME}/config-vars" \
            -d "{\"FQDN\":\"${CLEAN_FQDN}\",\"HEROKU_APP_NAME\":\"${HEROKU_APP_NAME}\"}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer ${HEROKU_API_KEY}"
          
          echo "FQDN config-var successfully synchronized!"

      - name: Release Container on Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          curl -n -X PATCH https://api.heroku.com/apps/${HEROKU_APP_NAME}/formation \
            -d '{
              "updates": [
                {
                  "type": "web",
                  "docker_image": "'"$(docker inspect registry.heroku.com/${HEROKU_APP_NAME}/web --format='{{index .RepoDigests 0}}')"'",
                  "quantity": 1,
                  "size": "eco"
                }
              ]
            }' \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer ${HEROKU_API_KEY}"

