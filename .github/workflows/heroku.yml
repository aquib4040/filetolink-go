name: Deploy to Heroku

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Heroku CLI Container Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Heroku CLI Authentication
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          echo "Setting up Heroku CLI credentials..."
          cat << EOF > ~/.netrc
          machine api.heroku.com
            login ${HEROKU_EMAIL}
            password ${HEROKU_API_KEY}
          machine git.heroku.com
            login ${HEROKU_EMAIL}
            password ${HEROKU_API_KEY}
          EOF

      - name: Setup Heroku App & Auto-Detect Dynamic FQDN
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "Checking Heroku app status for '${HEROKU_APP_NAME}'..."
          if ! heroku apps:info -a "${HEROKU_APP_NAME}" > /dev/null 2>&1; then
            echo "App does not exist. Creating new Heroku app: ${HEROKU_APP_NAME}"
            heroku apps:create "${HEROKU_APP_NAME}"
          else
            echo "Using existing Heroku app: ${HEROKU_APP_NAME}"
          fi

          echo "Setting stack to container for Docker builds..."
          heroku stack:set container -a "${HEROKU_APP_NAME}"

          echo "Querying dynamic App URL from Heroku..."
          APP_INFO=$(heroku apps:info -a "${HEROKU_APP_NAME}" --json)
          APP_URL=$(echo "${APP_INFO}" | jq -r '.app.web_url // empty')
          CLEAN_FQDN=$(echo "${APP_URL}" | sed -e 's~https://~~' -e 's~http://~~' -e 's~/~~g')

          echo "Discovered dynamic FQDN: ${CLEAN_FQDN}"
          if [ -n "${CLEAN_FQDN}" ]; then
            echo "Configuring FQDN in Heroku config-vars..."
            heroku config:set FQDN="${CLEAN_FQDN}" -a "${HEROKU_APP_NAME}"
          fi

      - name: Deploy Container via Heroku Git Push
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          echo "Configuring Heroku Git Remote..."
          heroku git:remote -a "${HEROKU_APP_NAME}"

          echo "Pushing code to Heroku Container Stack..."
          git push heroku main:main --force
